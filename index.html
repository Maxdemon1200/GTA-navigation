<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA Navigation</title>
<link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap');
:root{--lime:#b7f34a;--panel:rgba(15,19,15,.9);--line:rgba(224,239,211,.22)}
*{box-sizing:border-box}
body{margin:0;background:#090d12;color:#f5f5eb;font-family:'Rajdhani',sans-serif;overflow:hidden}
#map{position:absolute;inset:0}
#map:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#080b0877,transparent 22%,transparent 72%,#080b0866)}
.top{position:absolute;top:17px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.logo{font:900 35px/.8 'Barlow Condensed';letter-spacing:1px;color:#fff;text-shadow:2px 3px 0 #30352b,0 4px 12px #000}
.logo span{display:block;color:var(--lime);font:800 13px 'Rajdhani';letter-spacing:5px;margin-top:7px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:13px 15px;box-shadow:0 8px 26px #0009;backdrop-filter:blur(13px)}
#gps{font:700 11px 'Rajdhani';letter-spacing:1.7px;color:#dce5d4}
.search{position:absolute;top:83px;left:20px;right:auto;width:min(390px,calc(100vw - 40px));display:flex;gap:7px;padding:12px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--lime);box-shadow:0 12px 35px #0008;backdrop-filter:blur(14px)}
input{flex:1;min-width:0;background:#090c09;color:white;border:1px solid #596050;border-radius:2px;padding:12px;font:600 15px 'Rajdhani';outline:none}
input:focus{border-color:var(--lime)}
input::placeholder{color:#879080}
button{border:0;border-radius:2px;background:var(--lime);color:#151a10;font:900 13px 'Rajdhani';letter-spacing:1.5px;padding:0 16px;cursor:pointer}
#start-nav{display:none;margin-top:12px;width:100%;min-height:43px;background:var(--lime);color:#151a10;font:900 15px 'Barlow Condensed';letter-spacing:2px}
#start-nav.visible{display:block}
#start-nav.stop{background:#d94b42;color:#fff}
.bottom{position:absolute;bottom:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:end;gap:10px}
.bottom>.panel{width:min(390px,calc(100vw - 40px));border-top:2px solid var(--lime)}
.info{font:700 11px 'Rajdhani';letter-spacing:2px;color:#aab4a1}
.big{font:900 27px/.95 'Barlow Condensed';letter-spacing:1px;margin-top:7px;color:#fff}
.controls{display:flex;flex-direction:column;gap:7px}
.controls button{width:44px;height:44px;min-width:44px;padding:0;background:var(--panel);color:#fff;border:1px solid var(--line);font-size:16px;backdrop-filter:blur(10px);box-shadow:0 5px 16px #0008}
.controls button:first-child{background:var(--lime);color:#151a10;border-color:var(--lime)}
#message{position:absolute;top:145px;left:22px;right:20px;text-align:left;font:700 11px 'Rajdhani';letter-spacing:1.5px;color:#e7f2d9;text-shadow:0 2px 8px #000;pointer-events:none}
.maplibregl-ctrl-bottom-right{right:16px;bottom:18px}
.maplibregl-ctrl-group{background:#171b16!important;border:1px solid var(--line)!important;border-radius:3px!important;overflow:hidden;box-shadow:0 8px 24px #0008!important}
.maplibregl-ctrl-group button{background:transparent!important;width:36px!important;height:36px!important}
.maplibregl-ctrl-group button span{filter:invert(1)}

#results{display:none;position:absolute;top:145px;left:20px;width:min(390px,calc(100vw - 40px));max-height:42vh;overflow:auto;background:rgba(12,16,12,.96);border:1px solid var(--line);border-left:3px solid var(--lime);z-index:5;box-shadow:0 12px 35px #000b;backdrop-filter:blur(14px)}
.result-item{display:block;width:100%;padding:11px 13px;text-align:left;background:transparent;color:#f5f5eb;border:0;border-bottom:1px solid #ffffff20;font:600 13px 'Rajdhani';letter-spacing:.3px;line-height:1.35}
.result-item:hover{background:#b7f34a;color:#111}
@media(max-width:600px){
 #results{top:127px;left:12px;width:calc(100vw - 24px)}
 .top{top:12px;left:12px;right:12px}.logo{font-size:29px}.logo span{font-size:10px;letter-spacing:3px;margin-top:6px}
 #gps{font-size:9px;letter-spacing:1px}.top .panel{padding:9px 10px}
 .search{top:68px;left:12px;width:calc(100vw - 24px);padding:9px}
 .bottom{left:12px;right:12px;bottom:12px}.bottom>.panel{width:calc(100vw - 24px);padding:10px 13px}
 .big{font-size:23px}.controls{position:absolute;right:0;bottom:88px;flex-direction:row;gap:6px}
 .controls button{width:39px;height:39px;min-width:39px}
 #message{top:127px;left:14px;font-size:10px}
 .maplibregl-ctrl-bottom-right{right:12px;bottom:12px}
}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
 <div class="logo">GTA<span>NAVIGATION SYSTEM</span></div>
 <div class="panel info" id="gps">GPS: IN ATTESA</div>
</div>
<div class="search">
 <input id="destination" placeholder="Cerca una destinazione...">
 <button onclick="searchPlace()">CERCA</button>
</div>
<div id="results"></div>
<div id="message">◆ ESPLORAZIONE LIBERA · MAPPA PRONTA</div>
<div class="bottom">
 <div class="panel">
  <div class="info">NAVIGATION SYSTEM</div>
  <div class="big" id="status">FREE ROAM</div>
  <div class="info" id="distance">Nessun percorso attivo</div>
  <button id="start-nav" onclick="toggleNavigation()">▶ AVVIA NAVIGAZIONE</button>
 </div>
 <div class="controls">
  <button onclick="locate()" title="GPS">◎</button>
  <button onclick="tilt()" title="Vista 3D">3D</button>
  <button onclick="resetView()" title="Bussola">N</button>
 </div>
</div>
<script>
const map=new maplibregl.Map({
 container:'map',
 style:'https://tiles.openfreemap.org/styles/dark',
 center:[8.56,40.56],
 zoom:13,
 pitch:58,
 bearing:-15,
 antialias:true
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
let userMarker=null;
let destinationMarker=null;
let routeLayer=false;
let is3D=true;
let userPosition=null;
let destinationPosition=null;
let navigationActive=false;
let watchId=null;

map.on('load',()=>{
 document.getElementById('message').textContent='MAPPA PRONTA · GTA NAVIGATION';
 const layers=map.getStyle().layers;
 const labelLayer=layers.find(l=>l.type==='symbol' && l.layout && l.layout['text-field']);
 if(labelLayer){
  map.addLayer({
   id:'3d-buildings',
   source:'openmaptiles',
   'source-layer':'building',
   type:'fill-extrusion',
   minzoom:13,
   paint:{
    'fill-extrusion-color':'#59636b',
    'fill-extrusion-height':['coalesce',['get','render_height'],8],
    'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
    'fill-extrusion-opacity':0.75
   }
  },labelLayer.id);
 }
});

function locate(){
 if(!navigator.geolocation){alert('GPS non disponibile');return}
 document.getElementById('gps').textContent='GPS: RICERCA...';
 navigator.geolocation.getCurrentPosition(pos=>{
  userPosition=[pos.coords.longitude,pos.coords.latitude];
  if(userMarker)userMarker.remove();
  userMarker=new maplibregl.Marker({color:'#a8e638'}).setLngLat(userPosition).addTo(map);
  map.flyTo({center:userPosition,zoom:16,pitch:65});
  document.getElementById('gps').textContent='GPS: ATTIVO';
  document.getElementById('message').textContent='POSIZIONE RILEVATA';
 },()=>{document.getElementById('gps').textContent='GPS: NON DISPONIBILE';alert('Impossibile ottenere la posizione. Controlla i permessi GPS.')},{enableHighAccuracy:true,timeout:12000});
}

function tilt(){
 is3D=!is3D;
 map.easeTo({pitch:is3D?60:0,duration:700});
}
function resetView(){map.easeTo({bearing:0,pitch:is3D?60:0,duration:700})}

async function searchPlace(){
 const q=document.getElementById('destination').value.trim();
 if(!q)return;
 const results=document.getElementById('results');
 results.innerHTML='';results.style.display='none';
 document.getElementById('message').textContent='RICERCA INDIRIZZO...';
 try{
  const url='https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=6&countrycodes=it&q='+encodeURIComponent(q);
  const r=await fetch(url,{headers:{'Accept-Language':'it'}});
  const data=await r.json();
  if(!data.length){document.getElementById('message').textContent='INDIRIZZO NON TROVATO · CONTROLLA LA VIA';return}
  results.style.display='block';
  data.forEach(item=>{
   const option=document.createElement('button');
   option.className='result-item';option.type='button';
   option.textContent=item.display_name;
   option.addEventListener('click',()=>selectDestination(item));
   results.appendChild(option);
  });
  document.getElementById('message').textContent='SELEZIONA L’INDIRIZZO CORRETTO · IL PERCORSO PARTIRÀ SUBITO';
 }catch(e){document.getElementById('message').textContent='ERRORE DI CONNESSIONE · RIPROVA'}
}
function selectDestination(item){
 document.getElementById('results').style.display='none';
 destinationPosition=[Number(item.lon),Number(item.lat)];
 if(destinationMarker)destinationMarker.remove();
 destinationMarker=new maplibregl.Marker({color:'#ffbd38'}).setLngLat(destinationPosition).addTo(map);
 document.getElementById('status').textContent='CALCOLO PERCORSO';
 document.getElementById('distance').textContent=item.display_name;
 const startButton=document.getElementById('start-nav');
 startButton.classList.add('visible');startButton.classList.remove('stop');
 startButton.disabled=false;startButton.textContent='▶ CALCOLO IN CORSO...';
 document.getElementById('message').textContent='◆ DESTINAZIONE SELEZIONATA · CALCOLO DEL PERCORSO PIÙ VELOCE';
 toggleNavigation();
}
function getPositionForRoute(){
 return new Promise((resolve,reject)=>{
  navigator.geolocation.getCurrentPosition(resolve,error=>{
   if(error.code===1){reject(error);return}
   navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:false,timeout:12000,maximumAge:60000});
  },{enableHighAccuracy:true,timeout:15000,maximumAge:5000});
 });
}
async function toggleNavigation(){
 const button=document.getElementById('start-nav');
 if(navigationActive){
  navigationActive=false;
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}
  button.classList.remove('stop');button.textContent='▶ AVVIA NAVIGAZIONE';
  document.getElementById('status').textContent='PERCORSO INTERROTTO';
  document.getElementById('message').textContent='NAVIGAZIONE TERMINATA';
  return;
 }
 if(!destinationPosition){document.getElementById('message').textContent='INSERISCI E SELEZIONA UN INDIRIZZO';return}
 if(!navigator.geolocation){document.getElementById('message').textContent='GPS NON SUPPORTATO: APRI IL SITO IN CHROME O SAFARI';return}
 button.disabled=true;button.textContent='RICERCA GPS...';
 document.getElementById('gps').textContent='GPS: RICERCA...';
 document.getElementById('message').textContent='◆ RILEVAMENTO DELLA TUA POSIZIONE GPS';
 try{
  const pos=await getPositionForRoute();
  userPosition=[pos.coords.longitude,pos.coords.latitude];
  if(userMarker)userMarker.remove();
  userMarker=new maplibregl.Marker({color:'#b7f34a'}).setLngLat(userPosition).addTo(map);
  document.getElementById('gps').textContent='GPS: ATTIVO';
  button.textContent='CALCOLO PERCORSO...';
  document.getElementById('message').textContent='◆ CALCOLO DEL PERCORSO STRADALE PIÙ RAPIDO';
  const coords=userPosition[0]+','+userPosition[1]+';'+destinationPosition[0]+','+destinationPosition[1];
  const url='https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=full&geometries=geojson&steps=true';
  const response=await fetch(url);
  if(!response.ok)throw new Error('ROUTE_SERVER');
  const result=await response.json();
  if(result.code!=='Ok'||!result.routes||!result.routes.length)throw new Error('NO_ROUTE');
  const route=result.routes[0];
  const feature={type:'Feature',properties:{},geometry:route.geometry};
  if(map.getSource('active-route'))map.getSource('active-route').setData(feature);
  else{
   map.addSource('active-route',{type:'geojson',data:feature});
   map.addLayer({id:'active-route-line',type:'line',source:'active-route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#b7f34a','line-width':7,'line-opacity':.98}});
  }
  const bounds=new maplibregl.LngLatBounds(userPosition,userPosition);
  route.geometry.coordinates.forEach(point=>bounds.extend(point));
  map.fitBounds(bounds,{padding:{top:145,bottom:190,left:45,right:45},duration:1200});
  navigationActive=true;
  button.disabled=false;button.classList.add('stop');button.textContent='■ TERMINA NAVIGAZIONE';
  document.getElementById('status').textContent='NAVIGAZIONE ATTIVA';
  const km=(route.distance/1000).toFixed(1);
  const mins=Math.max(1,Math.round(route.duration/60));
  document.getElementById('distance').textContent=km+' km · circa '+mins+' min · in auto';
  document.getElementById('message').textContent='◆ PERCORSO PRONTO · PARTENZA DALLA TUA POSIZIONE';
  watchId=navigator.geolocation.watchPosition(p=>{
   userPosition=[p.coords.longitude,p.coords.latitude];
   if(userMarker)userMarker.setLngLat(userPosition);
  },()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:20000});
 }catch(err){
  button.disabled=false;button.classList.remove('stop');button.textContent='▶ AVVIA NAVIGAZIONE';
  if(err.code===1){
   document.getElementById('gps').textContent='GPS: BLOCCATO';
   document.getElementById('message').textContent='POSIZIONE NEGATA: AUTORIZZA LA LOCALIZZAZIONE NELLE IMPOSTAZIONI DEL SITO';
  }else if(err.code===2||err.code===3){
   document.getElementById('gps').textContent='GPS: NON DISPONIBILE';
   document.getElementById('message').textContent='GPS NON RILEVATO: ATTIVA LA POSIZIONE DEL DISPOSITIVO E RIPROVA';
  }else if(err.message==='NO_ROUTE'){
   document.getElementById('message').textContent='NESSUN PERCORSO STRADALE TROVATO PER QUESTI DUE PUNTI';
  }else if(err.message==='ROUTE_SERVER'){
   document.getElementById('message').textContent='SERVIZIO PERCORSI MOMENTANEAMENTE NON DISPONIBILE · RIPROVA';
  }else{
   document.getElementById('message').textContent='ERRORE DI RETE NEL CALCOLO · CONTROLLA INTERNET E RIPROVA';
  }
 }
}
document.getElementById('destination').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlace()});
document.addEventListener('click',e=>{if(!e.target.closest('.search')&&!e.target.closest('#results'))document.getElementById('results').style.display='none'});
</script>
</body>
</html>
