<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA Navigation</title>
<link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap');
:root{--lime:#8b5cf6;--panel:rgba(15,19,15,.9);--line:rgba(224,239,211,.22)}
*{box-sizing:border-box}
body{margin:0;background:#090d12;color:#f5f5eb;font-family:'Rajdhani',sans-serif;overflow:hidden}
#map{position:absolute;inset:0}
#map:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#080b0877,transparent 22%,transparent 72%,#080b0866)}
.top{position:absolute;top:17px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.logo{font:900 35px/.8 'Barlow Condensed';letter-spacing:1px;color:#fff;text-shadow:2px 3px 0 #30352b,0 4px 12px #000}
.logo span{display:block;color:var(--lime);font:800 13px 'Rajdhani';letter-spacing:5px;margin-top:7px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:13px 15px;box-shadow:0 8px 26px #0009;backdrop-filter:blur(13px)}
#gps{font:700 11px 'Rajdhani';letter-spacing:1.7px;color:#dce5d4}
.search{position:absolute;top:83px;left:20px;right:auto;width:min(390px,calc(100vw - 40px));display:flex;gap:7px;padding:12px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--lime);box-shadow:0 12px 35px #0008;backdrop-filter:blur(14px)}
input{flex:1;min-width:0;background:#090c09;color:white;border:1px solid #596050;border-radius:2px;padding:12px;font:600 15px 'Rajdhani';outline:none}
input:focus{border-color:var(--lime)}
input::placeholder{color:#879080}
button{border:0;border-radius:2px;background:var(--lime);color:#151a10;font:900 13px 'Rajdhani';letter-spacing:1.5px;padding:0 16px;cursor:pointer}
#start-nav{display:none;margin-top:12px;width:100%;min-height:43px;background:var(--lime);color:#151a10;font:900 15px 'Barlow Condensed';letter-spacing:2px}
#start-nav.visible{display:block}
#start-nav.stop{background:#d94b42;color:#fff}
.bottom{position:absolute;bottom:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:end;gap:10px}
.bottom>.panel{width:min(390px,calc(100vw - 40px));border-top:2px solid var(--lime)}
.info{font:700 11px 'Rajdhani';letter-spacing:2px;color:#aab4a1}
.big{font:900 27px/.95 'Barlow Condensed';letter-spacing:1px;margin-top:7px;color:#fff}
.controls{display:flex;flex-direction:column;gap:7px}
.controls button{width:44px;height:44px;min-width:44px;padding:0;background:var(--panel);color:#fff;border:1px solid var(--line);font-size:16px;backdrop-filter:blur(10px);box-shadow:0 5px 16px #0008}
.controls button:first-child{background:var(--lime);color:#151a10;border-color:var(--lime)}
#message{position:absolute;top:145px;left:22px;right:20px;text-align:left;font:700 11px 'Rajdhani';letter-spacing:1.5px;color:#e7f2d9;text-shadow:0 2px 8px #000;pointer-events:none}
.maplibregl-ctrl-bottom-right{right:16px;bottom:18px}
.maplibregl-ctrl-group{background:#171b16!important;border:1px solid var(--line)!important;border-radius:3px!important;overflow:hidden;box-shadow:0 8px 24px #0008!important}
.maplibregl-ctrl-group button{background:transparent!important;width:36px!important;height:36px!important}
.maplibregl-ctrl-group button span{filter:invert(1)}

#nav-hud{display:none;position:absolute;top:83px;left:20px;width:min(390px,calc(100vw - 40px));z-index:4;background:rgba(10,15,11,.94);border:1px solid rgba(224,239,211,.28);border-left:4px solid var(--lime);padding:12px 15px;box-shadow:0 10px 30px #000b;backdrop-filter:blur(14px)}
#nav-hud.visible{display:block}
#nav-turn{font:900 22px/1.1 'Barlow Condensed';letter-spacing:1px;color:#fff}
#nav-sub{font:700 11px 'Rajdhani';letter-spacing:1.5px;color:var(--lime);margin-top:5px}
#nav-stats{display:flex;gap:22px;margin-top:12px;padding-top:9px;border-top:1px solid #ffffff25;font:700 10px 'Rajdhani';letter-spacing:1.2px;color:#bfc8b9}
#nav-stats span{display:flex;flex-direction:column;gap:3px}#nav-stats b{font:800 17px 'Barlow Condensed';color:#fff;letter-spacing:.5px}
@media(max-width:600px){#nav-hud{top:68px;left:12px;width:calc(100vw - 24px);padding:10px 12px}#nav-turn{font-size:19px}}
#poi-panel{position:absolute;top:145px;right:20px;width:270px;z-index:3;padding:0;overflow:hidden;border-left:3px solid var(--lime)}
#poi-toggle,#nav-exit{width:100%;min-height:42px;padding:10px 13px;display:flex;align-items:center;justify-content:space-between;background:transparent;color:#fff;font:900 13px 'Rajdhani';letter-spacing:1.6px;text-align:left}
#poi-content{padding:0 12px 12px}
.poi-group{border-top:1px solid #ffffff22;padding:8px 0}
.poi-heading{width:100%;padding:3px 0;background:transparent;color:var(--lime);text-align:left;display:flex;justify-content:space-between;font:800 11px 'Rajdhani';letter-spacing:1.3px}
.poi-options{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding-top:8px}
.poi-options label{display:flex;align-items:center;gap:6px;font:600 12px 'Rajdhani';color:#e9e9df}
.poi-options input{flex:0 0 auto;width:14px;height:14px;accent-color:#8b5cf6}
#poi-status{font:600 10px 'Rajdhani';color:#aeb7a9;line-height:1.4}
#nav-exit{position:absolute;right:8px;top:8px;width:auto;min-height:30px;border:1px solid #ffffff33;border-radius:5px;padding:4px 9px}
body.nav-mode #poi-panel,body.nav-mode .search,body.nav-mode .top,body.nav-mode .bottom,body.nav-mode #message{display:none!important}
body.nav-mode #nav-hud{display:block;position:absolute;top:18px;left:18px;width:min(360px,calc(100vw - 36px));border-left:4px solid #8b5cf6;border-radius:12px;padding:18px 16px 14px}
body.nav-mode #nav-turn{font-size:26px;padding-right:65px}
body.nav-mode #nav-sub{color:#b9a0ff}
@media(max-width:600px){#poi-panel{top:127px;right:12px;width:min(260px,calc(100vw - 24px));max-height:45vh;overflow:auto}body.nav-mode #nav-hud{top:12px;left:12px;width:calc(100vw - 24px)}body.nav-mode #nav-turn{font-size:21px}}
#results{display:none;position:absolute;top:145px;left:20px;width:min(390px,calc(100vw - 40px));max-height:42vh;overflow:auto;background:rgba(12,16,12,.96);border:1px solid var(--line);border-left:3px solid var(--lime);z-index:5;box-shadow:0 12px 35px #000b;backdrop-filter:blur(14px)}
.result-item{display:block;width:100%;padding:11px 13px;text-align:left;background:transparent;color:#f5f5eb;border:0;border-bottom:1px solid #ffffff20;font:600 13px 'Rajdhani';letter-spacing:.3px;line-height:1.35}
.result-item:hover{background:#8b5cf6;color:#111}
@media(max-width:600px){
 #results{top:127px;left:12px;width:calc(100vw - 24px)}
 .top{top:12px;left:12px;right:12px}.logo{font-size:29px}.logo span{font-size:10px;letter-spacing:3px;margin-top:6px}
 #gps{font-size:9px;letter-spacing:1px}.top .panel{padding:9px 10px}
 .search{top:68px;left:12px;width:calc(100vw - 24px);padding:9px}
 .bottom{left:12px;right:12px;bottom:12px}.bottom>.panel{width:calc(100vw - 24px);padding:10px 13px}
 .big{font-size:23px}.controls{position:absolute;right:0;bottom:88px;flex-direction:row;gap:6px}
 .controls button{width:39px;height:39px;min-width:39px}
 #message{top:127px;left:14px;font-size:10px}
 .maplibregl-ctrl-bottom-right{right:12px;bottom:12px}
}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
 <div class="logo">GTA<span>NAVIGATION SYSTEM</span></div>
 <div class="panel info" id="gps">GPS: IN ATTESA</div>
</div>
<div class="search">
 <input id="destination" placeholder="Cerca una destinazione...">
 <button onclick="searchPlace()">CERCA</button>
</div>
<div id="results"></div>
<aside id="poi-panel" class="panel">
 <button id="poi-toggle" type="button" aria-expanded="true">PUNTI DI INTERESSE <span>⌄</span></button>
 <div id="poi-content">
  <div class="poi-group"><button class="poi-heading" type="button">RISTORAZIONE <span>−</span></button><div class="poi-options">
   <label><input type="checkbox" data-poi="restaurant"> Ristoranti</label><label><input type="checkbox" data-poi="fast_food"> Fast food</label><label><input type="checkbox" data-poi="cafe"> Bar e caffè</label>
  </div></div>
  <div class="poi-group"><button class="poi-heading" type="button">SERVIZI <span>−</span></button><div class="poi-options">
   <label><input type="checkbox" data-poi="fuel"> Benzinai</label><label><input type="checkbox" data-poi="parking"> Parcheggi</label><label><input type="checkbox" data-poi="pharmacy"> Farmacie</label><label><input type="checkbox" data-poi="hospital"> Ospedali</label>
  </div></div>
  <div class="poi-group"><button class="poi-heading" type="button">NEGOZI E TEMPO LIBERO <span>−</span></button><div class="poi-options">
   <label><input type="checkbox" data-poi="supermarket"> Supermercati</label><label><input type="checkbox" data-poi="cinema"> Cinema</label><label><input type="checkbox" data-poi="beach"> Spiagge</label>
  </div></div>
  <div id="poi-status">Seleziona una categoria per mostrare i punti sulla mappa.</div>
 </div>
</aside>
<div id="nav-hud"><button id="nav-exit" type="button" title="Torna alla mappa">MAPPA</button><div class="info">PROSSIMA MANOVRA</div><div id="nav-turn">PROSEGUI DRITTO</div><div id="nav-sub">-- m</div><div id="nav-stats"><span>VELOCITÀ <b id="nav-speed">0 km/h</b></span><span>ARRIVO <b id="nav-eta">--:--</b></span></div></div>
<div id="message">◆ ESPLORAZIONE LIBERA · MAPPA PRONTA</div>
<div class="bottom">
 <div class="panel">
  <div class="info">NAVIGATION SYSTEM</div>
  <div class="big" id="status">FREE ROAM</div>
  <div class="info" id="distance">Nessun percorso attivo</div>
  <button id="start-nav" onclick="toggleNavigation()">▶ AVVIA NAVIGAZIONE</button>
 </div>
 <div class="controls">
  <button onclick="locate()" title="GPS">◎</button>
  <button onclick="tilt()" title="Vista 3D">3D</button>
  <button onclick="resetView()" title="Bussola">N</button>
 </div>
</div>
<script>
const map=new maplibregl.Map({
 container:'map',
 style:'https://tiles.openfreemap.org/styles/dark',
 center:[8.56,40.56],
 zoom:13,
 pitch:58,
 bearing:-15,
 antialias:true
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
let userMarker=null;
let destinationMarker=null;
let routeLayer=false;
let is3D=true;
let userPosition=null;
let destinationPosition=null;
let navigationActive=false;
let watchId=null;
let activeRoute=null;
let routeSteps=[];
let routeCum=[];
let previousGpsPosition=null;
let lastRerouteAt=0;
let poiMarkers=[];
const poiTags={restaurant:['amenity','restaurant'],fast_food:['amenity','fast_food'],cafe:['amenity','cafe'],fuel:['amenity','fuel'],parking:['amenity','parking'],pharmacy:['amenity','pharmacy'],hospital:['amenity','hospital'],supermarket:['shop','supermarket'],cinema:['amenity','cinema'],beach:['natural','beach']};
let navCameraReady=false;

function applyGtaSixMapPalette(){
 const layers=map.getStyle().layers||[];
 const safePaint=(id,key,value)=>{try{map.setPaintProperty(id,key,value)}catch(e){}};
 layers.forEach(layer=>{
  const id=(layer.id||'').toLowerCase();
  const sourceLayer=(layer['source-layer']||'').toLowerCase();
  if(layer.type==='background')safePaint(layer.id,'background-color','#c9c4b5');
  if(layer.type==='fill'){
   if(/water/.test(id)||sourceLayer==='water')safePaint(layer.id,'fill-color','#78aeb7');
   else if(/park|garden|grass|wood|forest/.test(id)||/park|grass|wood|forest/.test(sourceLayer))safePaint(layer.id,'fill-color','#83a17c');
   else if(/landuse|landcover|residential|industrial|commercial/.test(id)||/landuse|landcover/.test(sourceLayer))safePaint(layer.id,'fill-color','#c4c0b2');
   else if(/building/.test(id)||sourceLayer==='building')safePaint(layer.id,'fill-color','#a9a294');
  }
  if(layer.type==='line'){
   if(/waterway/.test(id)||sourceLayer==='waterway')safePaint(layer.id,'line-color','#6b9fa9');
   else if(/transportation|road|street/.test(id)||sourceLayer==='transportation'){
    const isCasing=/casing|outline|case/.test(id);
    const isMajor=/motorway|trunk|primary|highway/.test(id);
    safePaint(layer.id,'line-color',isCasing?'#8d887d':(isMajor?'#e1b77c':'#eee9dc'));
   }
   else if(/boundary/.test(id)||sourceLayer==='boundary')safePaint(layer.id,'line-color','#aaa596');
  }
  if(layer.type==='symbol'){
   if(/water/.test(id))safePaint(layer.id,'text-color','#426f79');
   else if(/road|transportation/.test(id))safePaint(layer.id,'text-color','#655f55');
   else safePaint(layer.id,'text-color','#4f5149');
   safePaint(layer.id,'text-halo-color','#d8d2c3');
   safePaint(layer.id,'text-halo-width',1.1);
  }
 });
}
map.on('load',()=>{
 document.getElementById('message').textContent='MAPPA PRONTA · GTA NAVIGATION';
 setupPoiControls();
 applyGtaSixMapPalette();
 const layers=map.getStyle().layers;
 const labelLayer=layers.find(l=>l.type==='symbol' && l.layout && l.layout['text-field']);
 if(labelLayer&&!map.getLayer('3d-buildings')){
  map.addLayer({
   id:'3d-buildings',
   source:'openmaptiles',
   'source-layer':'building',
   type:'fill-extrusion',
   minzoom:12,
   paint:{
    'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],8],0,'#c4bba8',18,'#a99f8d',55,'#877f73'],
    'fill-extrusion-height':['coalesce',['get','render_height'],8],
    'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
    'fill-extrusion-opacity':0.98,
    'fill-extrusion-vertical-gradient':true
   }
  },labelLayer.id);
 }
 try{map.setFog({color:'#d5cfbf','high-color':'#e8dfc9','space-color':'#111820','horizon-blend':0.08,'star-intensity':0});}catch(e){}
});

function locate(){
 if(!navigator.geolocation){alert('GPS non disponibile');return}
 document.getElementById('gps').textContent='GPS: RICERCA...';
 navigator.geolocation.getCurrentPosition(pos=>{
  userPosition=[pos.coords.longitude,pos.coords.latitude];
  if(userMarker)userMarker.remove();
  userMarker=new maplibregl.Marker({color:'#a8e638'}).setLngLat(userPosition).addTo(map);
  map.flyTo({center:userPosition,zoom:16,pitch:65});
  document.getElementById('gps').textContent='GPS: ATTIVO';
  document.getElementById('message').textContent='POSIZIONE RILEVATA';
 },()=>{document.getElementById('gps').textContent='GPS: NON DISPONIBILE';alert('Impossibile ottenere la posizione. Controlla i permessi GPS.')},{enableHighAccuracy:true,timeout:12000});
}

function tilt(){
 is3D=!is3D;
 map.easeTo({pitch:is3D?60:0,duration:700});
}
function resetView(){map.easeTo({bearing:0,pitch:is3D?60:0,duration:700})}

async function searchPlace(){
 const q=document.getElementById('destination').value.trim();
 if(!q)return;
 const results=document.getElementById('results');
 results.innerHTML='';results.style.display='none';
 document.getElementById('message').textContent='RICERCA INDIRIZZO...';
 try{
  const url='https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=6&countrycodes=it&q='+encodeURIComponent(q);
  const r=await fetch(url,{headers:{'Accept-Language':'it'}});
  const data=await r.json();
  if(!data.length){document.getElementById('message').textContent='INDIRIZZO NON TROVATO · CONTROLLA LA VIA';return}
  results.style.display='block';
  data.forEach(item=>{
   const option=document.createElement('button');
   option.className='result-item';option.type='button';
   option.textContent=item.display_name;
   option.addEventListener('click',()=>selectDestination(item));
   results.appendChild(option);
  });
  document.getElementById('message').textContent='SELEZIONA L’INDIRIZZO CORRETTO · IL PERCORSO PARTIRÀ SUBITO';
 }catch(e){document.getElementById('message').textContent='ERRORE DI CONNESSIONE · RIPROVA'}
}
function selectDestination(item){
 document.getElementById('results').style.display='none';
 destinationPosition=[Number(item.lon),Number(item.lat)];
 if(destinationMarker)destinationMarker.remove();
 destinationMarker=new maplibregl.Marker({color:'#ffbd38'}).setLngLat(destinationPosition).addTo(map);
 document.getElementById('status').textContent='CALCOLO PERCORSO';
 document.getElementById('distance').textContent=item.display_name;
 const startButton=document.getElementById('start-nav');
 startButton.classList.add('visible');startButton.classList.remove('stop');
 startButton.disabled=true;startButton.textContent='CALCOLO PERCORSO...';
 document.getElementById('message').textContent='◆ CALCOLO DEL PERCORSO MIGLIORE · LA NAVIGAZIONE NON È ANCORA AVVIATA';
 prepareRoutePreview();
}
async function prepareRoutePreview(){
 const button=document.getElementById('start-nav');
 try{
  if(!navigator.geolocation)throw new Error('GPS_UNAVAILABLE');
  document.getElementById('gps').textContent='GPS: RICERCA...';
  const pos=await getPositionForRoute();
  userPosition=[pos.coords.longitude,pos.coords.latitude];
  if(userMarker)userMarker.remove();
  userMarker=new maplibregl.Marker({color:'#8b5cf6'}).setLngLat(userPosition).addTo(map);
  document.getElementById('gps').textContent='GPS: ATTIVO';
  const coords=userPosition[0]+','+userPosition[1]+';'+destinationPosition[0]+','+destinationPosition[1];
  const response=await fetch('https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=full&geometries=geojson&steps=true');
  if(!response.ok)throw new Error('ROUTE_SERVER');
  const result=await response.json();
  if(result.code!=='Ok'||!result.routes?.length)throw new Error('NO_ROUTE');
  const route=result.routes[0];
  activeRoute=route.geometry.coordinates;window.activeRouteDuration=route.duration;
  routeSteps=(route.legs||[]).flatMap(l=>l.steps||[]);
  routeCum=[0];for(let i=1;i<activeRoute.length;i++)routeCum[i]=routeCum[i-1]+metersBetween(activeRoute[i-1],activeRoute[i]);
  routeSteps.forEach(step=>{const loc=step.maneuver?.location;if(loc){let best=Infinity,ix=0;activeRoute.forEach((p,i)=>{const d=metersBetween(loc,p);if(d<best){best=d;ix=i;}});step._routeIndex=ix;}else step._routeIndex=0;});
  const feature={type:'Feature',properties:{},geometry:route.geometry};
  if(map.getSource('active-route'))map.getSource('active-route').setData(feature);
  else{
   map.addSource('active-route',{type:'geojson',data:feature});
   map.addLayer({id:'active-route-line',type:'line',source:'active-route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#8b5cf6','line-width':8,'line-opacity':.98}});
  }
  const bounds=new maplibregl.LngLatBounds(userPosition,userPosition);
  route.geometry.coordinates.forEach(point=>bounds.extend(point));
  map.fitBounds(bounds,{padding:{top:150,bottom:190,left:55,right:55},duration:1100});
  const km=(route.distance/1000).toFixed(1),mins=Math.max(1,Math.round(route.duration/60));
  document.getElementById('status').textContent='PERCORSO PRONTO';
  document.getElementById('distance').textContent=km+' km · circa '+mins+' min · percorso più veloce';
  button.disabled=false;button.textContent='▶ AVVIA NAVIGAZIONE';
  document.getElementById('message').textContent='PERCORSO MIGLIORE MOSTRATO · PREMI AVVIA NAVIGAZIONE QUANDO SEI PRONTO';
 }catch(err){
  button.disabled=true;button.textContent='PERCORSO NON DISPONIBILE';
  document.getElementById('status').textContent='ATTESA POSIZIONE GPS';
  document.getElementById('message').textContent=err.code===1?'AUTORIZZA LA POSIZIONE GPS PER CALCOLARE IL PERCORSO':err.message==='NO_ROUTE'?'NESSUN PERCORSO STRADALE TROVATO':'GPS O SERVIZIO PERCORSI NON DISPONIBILE · RIPROVA';
 }
}
function metersBetween(a,b){
 const R=6371000,rad=x=>x*Math.PI/180;
 const dLat=rad(b[1]-a[1]),dLon=rad(b[0]-a[0]);
 const q=Math.sin(dLat/2)**2+Math.cos(rad(a[1]))*Math.cos(rad(b[1]))*Math.sin(dLon/2)**2;
 return 2*R*Math.asin(Math.sqrt(q));
}
function nearestRouteIndex(pos){
 if(!activeRoute||!activeRoute.length)return 0;
 let best=Infinity,index=0;
 activeRoute.forEach((p,i)=>{const d=metersBetween(pos,p);if(d<best){best=d;index=i;}});
 return {index,distance:best};
}
function routeBearing(a,b){
 const rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI;
 const y=Math.sin(rad(b[0]-a[0]))*Math.cos(rad(b[1]));
 const x=Math.cos(rad(a[1]))*Math.sin(rad(b[1]))-Math.sin(rad(a[1]))*Math.cos(rad(b[1]))*Math.cos(rad(b[0]-a[0]));
 return (deg(Math.atan2(y,x))+360)%360;
}
function updateNavigationProgress(pos){
 if(!navigationActive||!activeRoute||!activeRoute.length)return;
 const nearest=nearestRouteIndex(pos),idx=nearest.index;
 let remaining=0;
 for(let i=idx;i<activeRoute.length-1;i++)remaining+=metersBetween(activeRoute[i],activeRoute[i+1]);
 const km=(remaining/1000).toFixed(1);
 const total=routeCum[routeCum.length-1]||1;
 const ratio=Math.max(0,Math.min(1,remaining/total));
 const mins=Math.max(1,Math.round((Number(window.activeRouteDuration)||0)*ratio/60));
 const eta=new Date(Date.now()+mins*60000);document.getElementById('nav-eta').textContent=eta.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
 document.getElementById('distance').textContent=km+' km rimanenti · circa '+mins+' min';
 const passed=activeRoute.slice(0,idx+1);
 if(passed.length>1){
  const data={type:'Feature',properties:{},geometry:{type:'LineString',coordinates:passed}};
  if(map.getSource('travelled-route'))map.getSource('travelled-route').setData(data);
 }
 let next=null,nextIndex=Infinity;
 routeSteps.forEach(s=>{if(s._routeIndex>=idx&&s._routeIndex<nextIndex){next=s;nextIndex=s._routeIndex;}});
 if(next){
  const toTurn=routeCum[nextIndex]-routeCum[idx];
  const m=next.maneuver||{},type=m.type||'continue',modifier=m.modifier||'';
  const words={left:'SVOLTA A SINISTRA',right:'SVOLTA A DESTRA',slight_left:'TIENI LA SINISTRA',slight_right:'TIENI LA DESTRA',sharp_left:'SVOLTA DECISAMENTE A SINISTRA',sharp_right:'SVOLTA DECISAMENTE A DESTRA',uturn:'INVERTI LA MARCIA',straight:'PROSEGUI DRITTO'};
  let instruction=words[modifier]|| (type==='roundabout'?'ENTRA NELLA ROTONDA':type==='arrive'?'SEI ARRIVATO A DESTINAZIONE':type==='depart'?'PROSEGUI DRITTO':'PROSEGUI');
  if(next.name)instruction+=' · '+next.name.toUpperCase();
  document.getElementById('nav-turn').textContent=instruction;
  document.getElementById('nav-sub').textContent=(Math.max(0,Math.round(toTurn))+' M ALLA MANOVRA').toString();
 }else{
  document.getElementById('nav-turn').textContent='SEI ARRIVATO A DESTINAZIONE';
  document.getElementById('nav-sub').textContent='PERCORSO COMPLETATO';
 }
 if(previousGpsPosition&&metersBetween(previousGpsPosition,pos)>2){
  const bearing=routeBearing(previousGpsPosition,pos);
  map.easeTo({center:pos,zoom:17.2,pitch:68,bearing,duration:850,essential:true});
 }else if(!navCameraReady){map.easeTo({center:pos,zoom:17.2,pitch:68,duration:1000});navCameraReady=true;}
 previousGpsPosition=pos;
 if(nearest.distance>85&&Date.now()-lastRerouteAt>20000){lastRerouteAt=Date.now();recalculateRoute(pos);}
}
async function recalculateRoute(pos){
 try{
  const coords=pos[0]+','+pos[1]+';'+destinationPosition[0]+','+destinationPosition[1];
  const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=full&geometries=geojson&steps=true');
  const d=await r.json();if(d.code!=='Ok'||!d.routes?.length)return;
  const route=d.routes[0];activeRoute=route.geometry.coordinates;window.activeRouteDuration=route.duration;
  routeSteps=(route.legs||[]).flatMap(l=>l.steps||[]);
  routeCum=[0];for(let i=1;i<activeRoute.length;i++)routeCum[i]=routeCum[i-1]+metersBetween(activeRoute[i-1],activeRoute[i]);
  routeSteps.forEach(s=>{const loc=s.maneuver?.location;if(loc){let best=Infinity,ix=0;activeRoute.forEach((p,i)=>{const d=metersBetween(loc,p);if(d<best){best=d;ix=i;}});s._routeIndex=ix;}else s._routeIndex=0;});
  const feature={type:'Feature',properties:{},geometry:route.geometry};
  if(map.getSource('active-route'))map.getSource('active-route').setData(feature);
  document.getElementById('message').textContent='PERCORSO RICALCOLATO';
 }catch(e){}
}
function getPositionForRoute(){
 return new Promise((resolve,reject)=>{
  navigator.geolocation.getCurrentPosition(resolve,error=>{
   if(error.code===1){reject(error);return}
   navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:false,timeout:12000,maximumAge:60000});
  },{enableHighAccuracy:true,timeout:15000,maximumAge:5000});
 });
}
async function toggleNavigation(){
 const button=document.getElementById('start-nav');
 if(navigationActive){
  navigationActive=false;
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}
  document.body.classList.remove('nav-mode');
  document.getElementById('nav-hud').classList.remove('visible');
  document.querySelector('.search').style.display='flex';
  previousGpsPosition=null;navCameraReady=false;
  button.classList.remove('stop');button.disabled=false;button.textContent='▶ AVVIA NAVIGAZIONE';
  document.getElementById('status').textContent='PERCORSO PRONTO';
  document.getElementById('message').textContent='NAVIGAZIONE TERMINATA · IL PERCORSO RESTA VISIBILE';
  return;
 }
 if(!destinationPosition||!activeRoute||!activeRoute.length){
  document.getElementById('message').textContent='PRIMA CERCA UNA DESTINAZIONE E ATTENDI IL CALCOLO DEL PERCORSO';
  return;
 }
 navigationActive=true;navCameraReady=false;previousGpsPosition=null;
 document.body.classList.add('nav-mode');
 document.getElementById('nav-hud').classList.add('visible');
 document.querySelector('.search').style.display='none';
 button.disabled=false;button.classList.add('stop');button.textContent='■ TERMINA NAVIGAZIONE';
 document.getElementById('status').textContent='NAVIGAZIONE ATTIVA';
 document.getElementById('message').textContent='NAVIGAZIONE AVVIATA · SEGNALE GPS ATTIVO';
 updateNavigationProgress(userPosition);
 watchId=navigator.geolocation.watchPosition(p=>{
  userPosition=[p.coords.longitude,p.coords.latitude];
  if(userMarker)userMarker.setLngLat(userPosition);
  updateNavigationProgress(userPosition);
  const speed=p.coords.speed;
  document.getElementById('nav-speed').textContent=(speed!==null&&Number.isFinite(speed)?Math.round(speed*3.6):0)+' km/h';
 },err=>{
  document.getElementById('gps').textContent='GPS: SEGNALE DEBOLE';
 },{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
}
document.getElementById('nav-exit').addEventListener('click',()=>{if(navigationActive)toggleNavigation();});
function setupPoiControls(){
 const toggle=document.getElementById('poi-toggle'),content=document.getElementById('poi-content');
 toggle.addEventListener('click',()=>{const hidden=content.style.display==='none';content.style.display=hidden?'block':'none';toggle.setAttribute('aria-expanded',String(hidden));toggle.querySelector('span').textContent=hidden?'⌄':'⌃';});
 document.querySelectorAll('.poi-heading').forEach(btn=>btn.addEventListener('click',()=>{const panel=btn.nextElementSibling;const hidden=panel.style.display==='none';panel.style.display=hidden?'grid':'none';btn.querySelector('span').textContent=hidden?'−':'+';}));
 document.querySelectorAll('[data-poi]').forEach(input=>input.addEventListener('change',loadSelectedPois));
}
async function loadSelectedPois(){
 const selected=[...document.querySelectorAll('[data-poi]:checked')].map(x=>x.dataset.poi);
 const status=document.getElementById('poi-status');
 poiMarkers.forEach(m=>m.remove());poiMarkers=[];
 if(!selected.length){status.textContent='Nessuna categoria selezionata.';return;}
 status.textContent='Caricamento punti di interesse...';
 const c=map.getCenter(),radius=5000;
 const clauses=selected.map(k=>{const [key,val]=poiTags[k];return 'node(around:'+radius+','+c.lat+','+c.lng+')['+key+'="'+val+'"];way(around:'+radius+','+c.lat+','+c.lng+')['+key+'="'+val+'"];';}).join('');
 const query='[out:json][timeout:20];('+clauses+');out center tags;';
 try{
  const response=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(query)});
  if(!response.ok)throw new Error('overpass');
  const data=await response.json();
  data.elements.slice(0,120).forEach(el=>{
   const lat=el.lat??el.center?.lat,lon=el.lon??el.center?.lon;if(!lat||!lon)return;
   const name=el.tags?.name||el.tags?.['name:it']||'Punto di interesse';
   const marker=document.createElement('div');marker.className='poi-marker';marker.title=name;
   marker.textContent='●';marker.style.cssText='color:#8b5cf6;font-size:24px;text-shadow:0 1px 6px #000;cursor:pointer';
   const popup=new maplibregl.Popup({offset:16}).setText(name);
   poiMarkers.push(new maplibregl.Marker({element:marker}).setLngLat([lon,lat]).setPopup(popup).addTo(map));
  });
  status.textContent=poiMarkers.length+' punti trovati entro 5 km.';
 }catch(e){status.textContent='Punti non disponibili al momento. Riprova tra poco.';}
}
map.on('moveend',()=>{if(document.querySelector('[data-poi]:checked'))loadSelectedPois();});
document.getElementById('destination').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlace()});
document.addEventListener('click',e=>{if(!e.target.closest('.search')&&!e.target.closest('#results'))document.getElementById('results').style.display='none'});
</script>
